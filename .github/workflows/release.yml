name: Windows desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deployment dependencies
        run: python -m pip install -e ".[terminal,deployment]"

      - name: Run Python tests
        run: python -m unittest discover -s tests -q

      - name: Set Tauri version from release tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must use the vMAJOR.MINOR.PATCH format."
          }
          $configPath = "frontend/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 20 | Set-Content $configPath -Encoding utf8

      - name: Build bundled Python bridge
        run: >-
          python -m PyInstaller --onefile --name personal-agent-bridge
          --collect-all winpty --paths src --distpath frontend/src-tauri/resources
          --workpath .build/pyinstaller --specpath .build/pyinstaller
          --clean packaging/bridge_entry.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build and upload signed Tauri installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: Personal Agent ${{ github.ref_name }}
          releaseBody: Windows 설치 파일입니다. Codex CLI 설치와 로그인이 필요합니다.
          releaseDraft: true
          prerelease: false

      - name: Publish completed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect release assets." }
          if ($assets -notcontains "latest.json") { throw "Updater manifest is missing." }
          if (-not ($assets | Where-Object { $_ -match '\.(exe|msi)$' })) { throw "Windows installer is missing." }
          if (-not ($assets | Where-Object { $_ -match '\.sig$' })) { throw "Updater signature is missing." }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the release." }
